<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    background: #001f3f; /* Navy blue */
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  #cross {
    width: 55px;
    height: 230px;
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(180deg,#f6d878,#d4af37,#b68b22);
    border-radius: 14px;
    box-shadow: 0 0 35px #d4af37;
  }

  #cross::after {
    content: "";
    position: absolute;
    width: 170px;
    height: 55px;
    background: linear-gradient(180deg,#f6d878,#d4af37,#b68b22);
    left: 50%;
    top: 65px;
    transform: translateX(-50%);
    border-radius: 14px;
    box-shadow: 0 0 35px #d4af37;
  }
</style>
</head>
<body>

<div id="cross"></div>

</body>
</html>
